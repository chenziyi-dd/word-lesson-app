<style>

.mode-card{display:flex;align-items:center;gap:12px;border:1px solid #e8ecf3;border-radius:12px;padding:13px;margin-bottom:9px;background:#fff;cursor:pointer;}

.sbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}

.rw{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid #e8ecf3;border-radius:10px;margin-bottom:7px;background:#fff;cursor:pointer;}
.rw .rw-n{color:#a8b0c0;font-size:12px;flex:0 0 20px;}
.rw .rw-en{font-size:16px;font-weight:600;flex:1;}

.rw.no{border-color:#f0b5a4;background:#fffaf8;}

.rw .rw-ok{background:#e4f7ec;color:#149355;}
.rw .rw-ok.on{background:#18a058;color:#fff;}
.rw .rw-no{background:#ffece6;color:#d0402a;}
.rw .rw-no.on{background:#e0562f;color:#fff;}
</style>

<body>
<div id="app"></div>
<script>
/* =========================================================
   单词课排课系统（教师端·云同步版）
   流程：登录 → 预约排课（按学生，一节课一个学生）
        → 点击【上课】→ 上完课点击【下课】
        → 系统自动记录 1 节课 + 本节课单词生成 21 天抗遗忘复习
        → 【加入新单词】上传 Excel 即入词库
   数据存储：GitHub 数据仓库 + AES-GCM 端到端加密（同教培系统模式）
   ========================================================= */
var STORE_KEY = 'wordlesson_manager_v1';
var CLOUD_CFG = {
  rawUrls: [
    'https://chenziyi-dd.github.io/word-lesson-app/data.enc',
    'https://cdn.jsdelivr.net/gh/chenziyi-dd/word-lesson-app@main/data.enc',
    'https://raw.githubusercontent.com/chenziyi-dd/word-lesson-app/main/data.enc'
  ],
  apiData:  'https://api.github.com/repos/chenziyi-dd/word-lesson-app/contents/data.enc',
  pbkdf2Iter: 100000
};
function getWriteToken(){ return localStorage.getItem('wordlesson_write_token')||''; }

/* ---------- 云端加密层（Web Crypto：PBKDF2 + AES-GCM） ---------- */
var CRYPTO = {
  te: new TextEncoder(), td: new TextDecoder(),
  b64: function(buf){ var b=new Uint8Array(buf), s=''; for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); },
  unb64: function(str){ var s=atob(str), b=new Uint8Array(s.length); for(var i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return b; },
  hex: function(b){ var s=''; for(var i=0;i<b.length;i++) s+=(b[i]<16?'0':'')+b[i].toString(16); return s; },
  unhex: function(str){ var b=new Uint8Array(str.length/2); for(var i=0;i<b.length;i++) b[i]=parseInt(str.substr(i*2,2),16); return b; },
  deriveKek: function(pass, saltBytes){
    return crypto.subtle.importKey('raw', this.te.encode(pass), 'PBKDF2', false, ['deriveKey']).then(function(km){
      return crypto.subtle.deriveKey({name:'PBKDF2', salt:saltBytes, iterations:CLOUD_CFG.pbkdf2Iter, hash:'SHA-256'}, km,
        {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
    });
  },
  wrapKey: function(pass, masterKeyBytes){
    var salt=crypto.getRandomValues(new Uint8Array(16));
    var iv=crypto.getRandomValues(new Uint8Array(12));
    var self=this;
    return this.deriveKek(pass, salt).then(function(kek){
      return crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, kek, masterKeyBytes);
    }).then(function(wrapBuf){
      return {salt:self.hex(salt), iv:self.hex(iv), wrap:self.b64(wrapBuf)};
    });
  },
  unwrapKey: function(pass, acct){
    var self=this;
    return this.deriveKek(pass, this.unhex(acct.salt)).then(function(kek){
      return crypto.subtle.decrypt({name:'AES-GCM', iv:self.unhex(acct.iv)}, kek, self.unb64(acct.wrap));
    });
  },
  encryptJson: function(obj, masterKeyBytes){
    var iv=crypto.getRandomValues(new Uint8Array(12));
    var self=this;
    return crypto.subtle.importKey('raw', masterKeyBytes, 'AES-GCM', false, ['encrypt']).then(function(k){
      return crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, k, self.te.encode(JSON.stringify(obj)));
    }).then(function(buf){
      return {iv:self.hex(iv), data:self.b64(buf)};
    });
  },
  decryptJson: function(blob, masterKeyBytes){
    var self=this;
    var ivHex = blob.dataIv || blob.iv;
    return crypto.subtle.importKey('raw', masterKeyBytes, 'AES-GCM', false, ['decrypt']).then(function(k){
      return crypto.subtle.decrypt({name:'AES-GCM', iv:self.unhex(ivHex)}, k, self.unb64(blob.data));
    }).then(function(buf){
      return JSON.parse(self.td.decode(buf));
    });
  },
  randomKey: function(){ return crypto.getRandomValues(new Uint8Array(32)); }
};

/* ---------- 云同步状态 ---------- */
var cloud = { blob:null, status:'未同步', pendingPush:false, pushing:false, masterKey:null, wrapCache:{}, lastSync:'', lastPulledVer:'', lastPushError:'' };
/* 云端加密层说明：Excel 解析组件不再在头部同步加载（国内 CDN 慢会卡白屏），改为导入时按需加载 */
var FETCH_TIMEOUT_MS = 9000;
function fetchTimeout(url){
  return Promise.race([
    fetch(url, {cache:'no-store'}),
    new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('请求超时')); }, FETCH_TIMEOUT_MS); })
  ]);
}
function cloudFetchOne(url){
  return fetchTimeout(url + (url.indexOf('?')<0?'?t=':'&t=') + Date.now()).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(txt){
    txt = txt.trim();
    if(!txt || txt.indexOf('{')!==0) throw new Error('云端暂无数据');
    var blob = JSON.parse(txt);
    if(!blob.accounts) throw new Error('格式不正确');
    localStorage.setItem('wordlesson_cloud_cache', JSON.stringify(blob));
    return blob;
  });
}
function cloudFetch(){
  var urls = CLOUD_CFG.rawUrls.slice();
  function tryNext(){
    if(!urls.length) return Promise.reject(new Error('所有云端通道均不可用'));
    return cloudFetchOne(urls.shift()).catch(function(){ return tryNext(); });
  }
  return tryNext();
}
function cloudFetchWithCache(){
  return cloudFetch().catch(function(e){
    var cached = localStorage.getItem('wordlesson_cloud_cache');
    if(cached){ cloud.status='离线（使用本机缓存）'; return JSON.parse(cached); }
    return null;
  });
}
/* 重建账号表（仅教师一个账号） */
function buildAccounts(){
  var cached = cloud.wrapCache['teacher'];
  if(cached && cached.pass===data.account.pass){
    return Promise.resolve({teacher: cached.acct});
  }
  return CRYPTO.wrapKey(data.account.pass, cloud.masterKey).then(function(acct){
    cloud.wrapCache['teacher']={pass:data.account.pass, acct:acct};
    return {teacher:acct};
  });
}
/* 加密并缓存 → 防抖上传云端 */
var pushTimer=null;
function saveData(cb){
  data.updatedAt = nowStr();
  if(!session.ok || !cloud.masterKey){ if(cb) cb(); return; }
  buildAccounts().then(function(accounts){
    return CRYPTO.encryptJson(data, cloud.masterKey).then(function(enc){
      var blob = {v:1, ver:nowStr(), dataIv:enc.iv, data:enc.data, accounts:accounts};
      cloud.blob = blob;
      localStorage.setItem('wordlesson_cloud_cache', JSON.stringify(blob));
      cloud.pendingPush = true;
      if(pushTimer) clearTimeout(pushTimer);
      cloud.status='已加密，待上传';
      pushTimer = setTimeout(function(){ cloudPush(true); }, 2500);
      if(cb) cb();
    });
  }).catch(function(e){ cloud.status='加密失败：'+e.message; if(cb) cb(); });
}
function manualSave(){
  if(!getWriteToken()){
    alert('⚠️ 本机未配置云端同步令牌，无法上传云端！\n\n请到「设置→云端同步令牌」粘贴令牌后，再回来点保存。\n（此前的数据已加密保存在本机，不会丢）');
    return;
  }
  saveData(function(){
    if(pushTimer) clearTimeout(pushTimer);
    setTimeout(function(){ cloudPush(false); }, 300);
  });
}
/* 云端与本机数据自动合并：各集合按 id 取并集，词库再按单词本身去重，日志去重合并 */
function mergeCloudData(remote){
  if(!remote || !Array.isArray(remote.students)) return;
  function byIdMap(arr){ var m={}; (arr||[]).forEach(function(x){ if(x && x.id) m[x.id]=x; }); return m; }
  ['students','lessons'].forEach(function(key){
    var mine = byIdMap(data[key]);
    (remote[key]||[]).forEach(function(x){
      if(x && x.id && !mine[x.id]){ (data[key]=data[key]||[]).push(x); mine[x.id]=x; }
    });
  });
  /* 词库：先按 id 并集，再按单词文本去重（不同设备分别上传的同一单词只留一条） */
  var myBank = byIdMap(data.wordBank);
  var seenEn = {};
  (data.wordBank||[]).forEach(function(w){ if(w && w.en) seenEn[String(w.en).toLowerCase()]=1; });
  (remote.wordBank||[]).forEach(function(w){
    if(!w || !w.id) return;
    if(myBank[w.id]) return;
    if(w.en && seenEn[String(w.en).toLowerCase()]) return;
    (data.wordBank=data.wordBank||[]).push(w); seenEn[String(w.en).toLowerCase()]=1;
  });
  var seen={}, logs=[];
  (remote.logs||[]).forEach(function(l){ var k=(l.time||'')+'|'+(l.type||'')+'|'+(l.text||''); if(!seen[k]){ seen[k]=1; logs.push(l); } });
  (data.logs||[]).forEach(function(l){ var k=(l.time||'')+'|'+(l.type||'')+'|'+(l.text||''); if(!seen[k]){ seen[k]=1; logs.push(l); } });
  data.logs = logs;
  /* 背单词：掌握度按单词合并（取进度更高的一条）；本轮清单取更新时间较晚的；记录按 id 并集 */
  if(remote.studyStatus && typeof remote.studyStatus==='object'){
    data.studyStatus = data.studyStatus || {};
    for(var sk in remote.studyStatus){
      if(!Object.prototype.hasOwnProperty.call(remote.studyStatus, sk)) continue;
      var rs=remote.studyStatus[sk], ms=data.studyStatus[sk];
      if(!rs) continue;
      if(!ms){ data.studyStatus[sk]=rs; continue; }
      var rv=(rs.stage||0)*10000+(rs.right||0)*10+(rs.wrong||0);
      var mv=(ms.stage||0)*10000+(ms.right||0)*10+(ms.wrong||0);
      if(rv>mv) data.studyStatus[sk]=rs;
    }
  }
  if(remote.studyRound && (!data.studyRound || String(remote.studyRound.at||'')>String(data.studyRound.at||''))) data.studyRound = remote.studyRound;
  if(data.studyRound===undefined) data.studyRound = null;
  var sessSeen={}, sessArr=[];
  (data.studySessions||[]).forEach(function(x){ if(x && x.id && !sessSeen[x.id]){ sessSeen[x.id]=1; sessArr.push(x); } });
  (remote.studySessions||[]).forEach(function(x){ if(x && x.id && !sessSeen[x.id]){ sessSeen[x.id]=1; sessArr.push(x); } });
  data.studySessions = sessArr;
  if(remote.updatedAt && (!data.updatedAt || remote.updatedAt>data.updatedAt)) data.updatedAt=remote.updatedAt;
}
function cloudPush(silent){
  if(!cloud.pendingPush && !silent){ renderCloudStatus(); return; }
  if(cloud.pushing){ return; }
  var token = getWriteToken();
  if(!token){
    cloud.status='⚠️ 未配置同步令牌：数据已加密保存在本机，请到「设置→云端同步令牌」粘贴令牌后点击「立即上传」';
    if(!silent) alert(cloud.status);
    renderCloudStatus();
    return;
  }
  cloud.status='正在上传…';
  var payload = cloud.blob;
  if(!payload){ cloud.status='无待上传数据'; return; }
  cloud.pushing = true;
  function doPut(body){
    /* 注意：不能用 keepalive:true —— keepalive 请求体上限 64KB，词库大了会被浏览器静默拒绝 */
    return fetch(CLOUD_CFG.apiData, {
      method:'PUT',
      headers:{'Authorization':'token '+token, 'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
  }
  fetch(CLOUD_CFG.apiData, {headers:{'Authorization':'token '+token}})
    .then(function(r){ return r.json(); })
    .then(function(info){
      var remote = null;
      try{ remote = info && info.content ? JSON.parse(decodeURIComponent(escape(atob(info.content)))) : null; }catch(e){}
      var remoteNewer = remote && remote.ver && cloud.lastPulledVer && remote.ver > cloud.lastPulledVer;
      if(!remoteNewer){
        var body = { message: '同步 '+payload.ver, content: btoa(unescape(encodeURIComponent(JSON.stringify(payload)))) };
        if(info && info.sha) body.sha = info.sha;
        return doPut(body);
      }
      return CRYPTO.decryptJson(remote, cloud.masterKey).then(function(remoteData){
        mergeCloudData(remoteData);
        cloud.lastPulledVer = remote.ver;
        return buildAccounts().then(function(accounts){
          return CRYPTO.encryptJson(data, cloud.masterKey).then(function(enc){
            payload = {v:1, ver:nowStr(), dataIv:enc.iv, data:enc.data, accounts:accounts};
            cloud.blob = payload;
            try{ localStorage.setItem('wordlesson_cloud_cache', JSON.stringify(payload)); }catch(e){}
            var body = { message:'同步(自动合并) '+payload.ver, content: btoa(unescape(encodeURIComponent(JSON.stringify(payload)))) };
            if(info && info.sha) body.sha = info.sha;
            return doPut(body);
          });
        });
      }).catch(function(me){
        cloud.status='⏸️ 已暂停上传：云端改动无法自动合并，请刷新页面';
        if(!silent) alert('⚠️ 云端有其他设备的更新，自动合并失败：'+me.message+'\n\n你的数据已加密保存在本机，请刷新页面后再试。');
        renderCloudStatus();
        throw {paused:true};
      });
    })
    .then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(res){
      cloud.pendingPush=false; cloud.status='已同步'; cloud.lastSync=nowStr(); cloud.lastPushError='';
      cloud.lastPulledVer = payload.ver;
      renderCloudStatus();
      if(!silent) alert('✅ 已上传云端：'+ (res.commit? res.commit.sha.slice(0,7):''));
      cloud.pushing = false;
    })
    .catch(function(e){
      cloud.pushing = false;
      if(e && e.paused) return;
      cloud.status='上传失败（已保留在本机，稍后自动重试）';
      cloud.lastPushError=e.message;
      if(!silent) alert('上传云端失败：'+e.message+'\n数据已加密保存在本机，下次保存时会自动重试。');
      renderCloudStatus();
    });
}

function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function nowStr(){ var d=new Date(); return todayStr()+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function addDays(dateStr, n){
  var p = String(dateStr||'').split('-');
  if(p.length!==3) return '';
  var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10)+n);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}

function migrateData(){
  var changed=false;
  if(!Array.isArray(data.wordBank)){ data.wordBank=[]; changed=true; }
  if(!Array.isArray(data.lessons)){ data.lessons=[]; changed=true; }
  if(!Array.isArray(data.students)){ data.students=[]; changed=true; }
  if(!data.account){ data.account={pass:''}; changed=true; }
  if(!data.studyStatus || typeof data.studyStatus!=='object' || Array.isArray(data.studyStatus)){ data.studyStatus={}; changed=true; }
  if(!Array.isArray(data.studySessions)){ data.studySessions=[]; changed=true; }
  if(data.studyRound===undefined){ data.studyRound=null; changed=true; }
  data.lessons.forEach(function(l){
    if(!Array.isArray(l.words)){ l.words=[]; changed=true; }
    if(!l.status){ l.status = l.endedAt ? 'done' : 'booked'; changed=true; }
    if(l.status==='done' && !Array.isArray(l.review)){
      l.review = (l.words && l.words.length) ? genReviewRounds(l.date) : [];
      changed=true;
    }
  });
  if(changed) saveData();
}

/* ---------- 领域逻辑（纯函数，供测试） ---------- */
/* 生成 21 天抗遗忘复习轮次（基于上课日期） */
function genReviewRounds(baseDate){
  var rounds=[];
  for(var i=0;i<REVIEW_DAYS.length;i++){
    rounds.push({offset:REVIEW_DAYS[i], dueDate:addDays(baseDate, REVIEW_DAYS[i]), done:false, doneAt:null});
  }
  return rounds;
}
/* Excel 行解析：自动识别表头（单词/中文列），无表头按前两列处理 */
var EN_HEAD = /^(单词|词语|英文|英语|word|words|english|en)$/i;
var CN_HEAD = /(中文|释义|意思|翻译|词义|cn|chinese)/i;
function parseWordRows(rows){
  var out=[], skipped=0, headerUsed=false, ei=0, ci=1;
  if(!rows || !rows.length) return {words:[], skipped:0, headerUsed:false};
  var first = rows[0]||[];
  for(var c=0;c<first.length;c++){
    var cell = String(first[c]==null?'':first[c]).trim();
    if(EN_HEAD.test(cell)) ei=c;
    if(CN_HEAD.test(cell)) ci=c;
  }
  if(EN_HEAD.test(String(first[ei]==null?'':first[ei]).trim())) headerUsed=true;
  for(var r=(headerUsed?1:0); r<rows.length; r++){
    var row = rows[r]||[];
    var en = String(row[ei]==null?'':row[ei]).trim();
    var cn = String(row[ci]==null?'':row[ci]).trim();
    if(!en && !cn) continue;                       /* 整行空 → 跳过 */
    if(!en || !/[a-zA-Z]/.test(en) || en.length>40){ skipped++; continue; }
    var dup = false;
    for(var k=0;k<out.length;k++){ if(out[k].en.toLowerCase()===en.toLowerCase()){ dup=true; break; } }
    if(dup){ skipped++; continue; }
    out.push({en:en, cn:cn});
  }
  return {words:out, skipped:skipped, headerUsed:headerUsed};
}
/* 粘贴导入：每行一个单词，支持「单词  中文」「单词,中文」「单词\t中文」 */
function parsePasteText(txt){
  var lines = String(txt||'').split(/\r?\n/);
  var rows = lines.map(function(line){
    var s = line.trim();
    if(!s) return [];
    var m = s.split(/\t+|,{1,}| {2,}|，/);
    if(m.length===1) return [s, ''];
    return [m[0].trim(), m.slice(1).join(' ').trim()];
  });
  return parseWordRows(rows);
}
/* 词库去重入库 */
function dedupeAddWords(incoming){
  var map = {};
  data.wordBank.forEach(function(w){ if(w && w.en) map[String(w.en).toLowerCase()]=1; });
  var added=0, skipped=0;
  incoming.forEach(function(w){
    if(!w || !w.en) return;
    var key = String(w.en).toLowerCase();
    if(map[key]){ skipped++; return; }
    map[key]=1;
    data.wordBank.push({id:uid(), en:w.en, cn:w.cn||'', addedAt:nowStr()});
    added++;
  });
  return {added:added, skipped:skipped};
}
function getStudent(id){ for(var i=0;i<data.students.length;i++){ if(data.students[i].id===id) return data.students[i]; } return null; }
function getLesson(id){ for(var i=0;i<data.lessons.length;i++){ if(data.lessons[i].id===id) return data.lessons[i]; } return null; }
function studentName(lesson){ var s=getStudent(lesson.studentId); return s ? s.name : '（学生已删除）'; }
/* 学生累计已上课时（节数） */
function studentHours(studentId){
  var n=0;
  data.lessons.forEach(function(l){ if(l.studentId===studentId && l.status==='done') n++; });
  return n;
}
/* 学生全部课程（按日期倒序） */
function lessonsOf(studentId){
  return data.lessons.filter(function(l){ return l.studentId===studentId; })
    .sort(function(a,b){ return (b.date+(b.time||'')) .localeCompare(a.date+(a.time||'')); });
}
/* 某日期（含逾期）应复习的轮次列表：[{lesson, round, idx, late}] */
function dueRoundItems(dateStr){
  var items=[];
  data.lessons.forEach(function(l){
    if(l.status!=='done' || !l.words || !l.words.length || !Array.isArray(l.review)) return;
    l.review.forEach(function(rd, idx){
      if(!rd.done && rd.dueDate && rd.dueDate <= dateStr){
        items.push({lesson:l, round:rd, idx:idx, late: rd.dueDate < dateStr});
      }
    });
  });
  items.sort(function(a,b){ return (a.round.dueDate+a.lesson.id).localeCompare(b.round.dueDate+b.lesson.id); });
  return items;
}
/* 某日期已完成复习的轮次列表 */
function doneRoundItems(dateStr){
  var items=[];
  data.lessons.forEach(function(l){
    if(!Array.isArray(l.review)) return;
    l.review.forEach(function(rd, idx){
      if(rd.done && rd.doneAt && rd.doneAt.slice(0,10)===dateStr) items.push({lesson:l, round:rd, idx:idx});
    });
  });
  return items;
}
/* 单节课复习进度 x/5 */
function reviewProgress(lesson){
  if(!lesson.review || !lesson.review.length) return {done:0,total:0};
  var d=0;
  lesson.review.forEach(function(r){ if(r.done) d++; });
  return {done:d, total:lesson.review.length};
}
/* 下课后固化：记课时 + 生成抗遗忘 */
function finalizeLesson(lesson, words){
  lesson.words = words || lesson.words || [];
  lesson.status = 'done';
  lesson.endedAt = nowStr();
  lesson.review = lesson.words.length ? genReviewRounds(lesson.date) : [];
  return lesson.review;
}

function showLoading(){
  document.getElementById('app').innerHTML = '<div class="lock-wrap"><div class="lock-card" style="text-align:center">'
    + '<h2>📖 单词课排课系统</h2>'
    + '<div class="sub" style="margin-top:10px">正在加载'+'……'+'</div>'
    + '<div class="small" style="margin-top:6px">首次访问或网络较慢时，可能需要等待十几秒</div>'
    + '</div></div>';
}
function boot(){
  showLoading();
  /* 本机有加密缓存 → 秒开登录页，云端版本后台静默校验 */
  var cached = localStorage.getItem('wordlesson_cloud_cache');
  if(cached){
    try{
      var blob = JSON.parse(cached);
      if(blob && blob.accounts && blob.accounts.teacher){
        cloud.blob = blob;
        cloud.lastPulledVer = blob.ver||'';
        cloud.status='使用本机缓存';
        renderLock(false);
        /* 后台静默拉取云端：有更新则替换密文（登录后自动解到最新） */
        cloudFetch().then(function(nb){
          if(nb && nb.ver && nb.ver !== cloud.blob.ver){
            cloud.blob = nb; cloud.lastPulledVer = nb.ver||'';
            cloud.status='已同步（云端有新版本）';
            if(session.ok && cloud.masterKey){
              return CRYPTO.decryptJson(nb, cloud.masterKey).then(function(rd){
                mergeCloudData(rd);
                saveData();
                renderCloudStatus();
              });
            }
          }else{
            cloud.status='已同步';
          }
          renderCloudStatus();
        }).catch(function(){ cloud.status='离线（使用本机缓存）'; renderCloudStatus(); });
        return;
      }
    }catch(e){}
  }
  /* 无缓存：走云端拉取（每个通道最多 9 秒超时，全部失败也照常进入首用/登录页） */
  cloudFetchWithCache().then(function(blob){
    if(blob && blob.accounts && blob.accounts.teacher){
      cloud.blob = blob; cloud.lastPulledVer = blob.ver||'';
      renderLock(false);
    }else{
      renderLock(true);
    }
  }).catch(function(){ renderLock(false); });
}
function renderLock(isFirst){
  var h = '<div class="lock-wrap"><div class="lock-card">'
    + '<h2>📖 单词课排课系统</h2>'
    + '<div class="sub">排课 · 上课/下课 · 课时记录 · 单词21天抗遗忘</div>'
    + (isFirst
      ? '<div class="warn-tip">首次使用：请设置一个登录密码。<br>密码同时是云端数据的加密钥匙，<b>忘记无法找回</b>，请牢记并定期导出备份。</div>'
        + '<label class="f">设置密码（至少4位）</label><input type="password" id="lk-p1">'
        + '<label class="f">确认密码</label><input type="password" id="lk-p2">'
        + '<div style="margin-top:16px"><button class="btn big" onclick="firstSetup()">创建并进入系统</button></div>'
      : '<label class="f">登录密码</label><input type="password" id="lk-p1">'
        + '<div class="err" id="lk-err"></div>'
        + '<div style="margin-top:16px"><button class="btn big" onclick="tryUnlock()">登 录</button></div>')
    + '</div></div>';
  document.getElementById('app').innerHTML = h;
}
function lockErr(msg){ var e=document.getElementById('lk-err'); if(e){ e.style.display='block'; e.textContent=msg; } }
function firstSetup(){
  var p1=(document.getElementById('lk-p1').value||'').trim(), p2=(document.getElementById('lk-p2').value||'').trim();
  if(p1.length<4){ lockErr('密码至少 4 位'); return; }
  if(p1!==p2){ lockErr('两次输入的密码不一致'); return; }
  data = defaultData();
  data.account.pass = p1;
  cloud.masterKey = CRYPTO.randomKey();
  session.ok = true;
  addLog('系统', '系统初始化完成');
  saveData();
  alert('✅ 创建成功！数据已加密保存在本机。\n\n建议：到「设置」里粘贴云端同步令牌，以后任何设备登录同一密码即可同步。');
  renderApp('today');
}
function tryUnlock(){
  var pass=(document.getElementById('lk-p1').value||'').trim();
  if(!pass){ lockErr('请输入密码'); return; }
  var blob = cloud.blob;
  if(!blob){ lockErr('本机没有可解密的数据，请刷新页面'); return; }
  CRYPTO.unwrapKey(pass, blob.accounts.teacher).then(function(mk){
    return CRYPTO.decryptJson(blob, mk).then(function(d){
      cloud.masterKey = mk;
      data = d;
      migrateData();
      session.ok = true;
      renderApp('today');
    });
  }).catch(function(){ lockErr('密码错误'); });
}

var view='today';
var _lf = { studentId:'', status:'' };      /* 课程筛选 */
var _bankQ = '';                            /* 词库搜索 */
var _reviewDate = todayStr();               /* 抗遗忘查看日期 */
var _picker = null;                          /* 单词选择器上下文 {ctx, words} */
var _importPending = null;                  /* 待入库单词 */
var _pasteOpen = false;

function renderApp(v){
  if(v) view=v;
  var doneCnt=0; data.lessons.forEach(function(l){ if(l.status==='done') doneCnt++; });
  var h = '<div class="header"><h1>📖 单词课排课系统</h1>'
    + '<div class="hstat">学生 '+data.students.length+' · 词库 '+data.wordBank.length+' 词 · 已上 '+doneCnt+' 节课</div>'
    + '<div class="sub" id="cloud-status">'+cloud.status+(cloud.blob?' · 云端版本 '+cloud.blob.ver:'')+'</div></div>'
    + '<div class="nav">'
    + '<button id="nv-today" onclick="renderApp(\'today\')">🏠 今日</button>'
    + '<button id="nv-lessons" onclick="renderApp(\'lessons\')">📅 课程</button>'
    + '<button id="nv-review" onclick="renderApp(\'review\')">⏰ 抗遗忘</button>'
    + '<button id="nv-study" onclick="renderApp(\'study\')">🧠 背单词</button>'
    + '<button id="nv-bank" onclick="renderApp(\'bank\')">📚 词库</button>'
    + '<button id="nv-students" onclick="renderApp(\'students\')">👤 学生</button>'
    + '<button id="nv-settings" onclick="renderApp(\'settings\')">⚙️ 设置</button>'
    + '</div><div class="wrap" id="view"></div>'
    + '<div id="modal" onclick="if(event.target===this) closeModal()"><div class="box" id="modal-box"></div></div>';
  document.getElementById('app').innerHTML = h;
  renderView();
}
function renderView(){
  var navs = {today:1,lessons:1,review:1,study:1,bank:1,students:1,settings:1};
  for(var k in navs){ var b=document.getElementById('nv-'+k); if(b) b.className = (view===k?'on':''); }
  var el=document.getElementById('view');
  if(view==='today') el.innerHTML = viewToday();
  else if(view==='lessons') el.innerHTML = viewLessons();
  else if(view==='review') el.innerHTML = viewReview();
  else if(view==='study') el.innerHTML = viewStudy();
  else if(view==='bank') el.innerHTML = viewBank();
  else if(view==='students') el.innerHTML = viewStudents();
  else if(view==='settings') el.innerHTML = viewSettings();
  window.scrollTo(0,0);
}
function statusBadge(l){
  if(l.status==='booked') return '<span class="badge b-booked">📅 待上课</span>';
  if(l.status==='ongoing') return '<span class="badge b-ongoing">🔴 上课中</span>';
  if(l.status==='done') return '<span class="badge b-done">✅ 已上1节</span>';
  return '<span class="badge b-canceled">已取消</span>';
}
function lessonCard(l, opts){
  opts = opts||{};
  var h = '<div class="lrow '+l.status+'"><div class="top"><div><span class="stu">'+esc(studentName(l))+'</span> '
    + statusBadge(l) + '</div><span class="wnum">'+(l.words?l.words.length:0)+' 词</span></div>'
    + '<div class="when">'+fmtShort(l.date)+(l.time?' '+l.time:'')+(l.note?' · '+esc(l.note):'')+'</div>';
  if(opts.showWords && l.words && l.words.length){
    h += '<div class="words-line">'+ l.words.slice(0,12).map(function(w){ return '<span class="chip">'+esc(w.en)+' <span class="cn">'+esc(w.cn)+'</span></span>'; }).join('')
      + (l.words.length>12?' <span class="small">…共'+l.words.length+'词</span>':'') + '</div>';
  }
  if(l.status==='done' && l.words && l.words.length){
    var p = reviewProgress(l);
    h += '<div class="when">21天抗遗忘：'+p.done+'/'+p.total+' 轮'
      + (p.done<p.total?'（下次 '+fmtShort(nextDue(l))+'）':'（已全部完成 🎉）')+'</div>';
  }
  h += '<div class="acts">';
  if(l.status==='booked') h += '<button class="btn sm" onclick="startLesson(\''+l.id+'\')">▶ 上课</button>';
  if(l.status==='booked'||l.status==='ongoing') h += '<button class="btn sm sub" onclick="openEditWords(\''+l.id+'\')">✎ 单词</button>';
  if(l.status==='ongoing') h += '<button class="btn sm danger" onclick="openEndClass(\''+l.id+'\')">⏹ 下课</button>';
  if(l.status==='done' && l.words && l.words.length) h += '<button class="btn sm sub" onclick="renderApp(\'review\');_reviewDate=todayStr();renderApp(\'review\')">⏰ 复习进度</button>';
  if(l.status==='booked') h += '<button class="btn sm ghost" onclick="cancelLesson(\''+l.id+'\')">✕ 取消课</button>';
  if(l.status==='canceled') h += '<button class="btn sm ghost" onclick="restoreLesson(\''+l.id+'\')">↩ 恢复预约</button>';
  if(l.status!=='done') h += '<button class="btn sm ghost" onclick="delLesson(\''+l.id+'\')">🗑 删除</button>';
  h += '</div></div>';
  return h;
}
function nextDue(l){
  if(!l.review) return '';
  for(var i=0;i<l.review.length;i++){ if(!l.review[i].done) return l.review[i].dueDate; }
  return '';
}

/* ---------- 视图：今日 ---------- */
function viewToday(){
  var today = todayStr();
  var ongoing=[], dueToday=[], overdue=[];
  data.lessons.forEach(function(l){
    if(l.status==='ongoing') ongoing.push(l);
    else if(l.status==='booked'){ if(l.date===today) dueToday.push(l); else if(l.date<today) overdue.push(l); }
  });
  var reviews = dueRoundItems(today);
  var h = '<div class="stat-row">'
    + '<div class="stat-cell warn"><div class="n">'+overdue.length+'</div><div class="t">逾期未上课</div></div>'
    + '<div class="stat-cell"><div class="n">'+dueToday.length+'</div><div class="t">今日待上课</div></div>'
    + '<div class="stat-cell warn"><div class="n">'+(ongoing.length?1:0)+'</div><div class="t">进行中</div></div>'
    + '<div class="stat-cell ok"><div class="n">'+doneRoundItems(today).length+'</div><div class="t">今日已复习</div></div>'
    + '</div>';
  if(reviews.length){
    h += '<div class="sec-tip">⏰ 今天该复习的单词（含逾期）· 共 '+reviews.length+' 组</div>';
    h += reviews.map(function(it){ return reviewItemHTML(it, true); }).join('');
  }
  if(ongoing.length){
    h += '<div class="sec-tip">🔴 上课中</div>' + ongoing.map(function(l){ return lessonCard(l,{showWords:true}); }).join('');
  }
  if(dueToday.length){
    h += '<div class="sec-tip">📅 今天待上课</div>' + dueToday.map(function(l){ return lessonCard(l); }).join('');
  }
  if(overdue.length){
    h += '<div class="sec-tip"><span class="overdue">⚠️ 逾期未上（可点✎改日期 或 ✕取消）</span></div>' + overdue.map(function(l){ return lessonCard(l); }).join('');
  }
  var doneToday = data.lessons.filter(function(l){ return l.status==='done' && l.endedAt && l.endedAt.slice(0,10)===today; });
  if(doneToday.length){
    h += '<div class="sec-tip">✅ 今天已下课 '+doneToday.length+' 节</div>' + doneToday.map(function(l){ return lessonCard(l); }).join('');
  }
  if(!dueToday.length && !overdue.length && !ongoing.length && !reviews.length && !doneToday.length){
    h += '<div class="card"><div class="empty">今天没有排课，也没有到期的复习</div>'
      + '<button class="btn big" onclick="openBooking()">＋ 预约排课</button></div>';
  }
  return h;
}
function reviewItemHTML(it, showStudent){
  var l = it.lesson;
  var tag = '<span class="round-tag'+(it.late?' hot':'')+'"'+'>'+(it.late?'逾期':'第'+(it.idx+1)+'轮')+' · 第'+it.round.offset+'天</span>';
  var h = '<div class="review-item'+(it.late?' late':'')+'"><div class="top"><div><span class="stu">'+(showStudent?esc(studentName(l))+' · ':'')+fmtShort(l.date)+' 课</span> '+tag+'</div>'
    + '<span class="small">'+(it.late?'原定 ':'') + fmtShort(it.round.dueDate)+'</span></div>'
    + '<div style="margin-top:7px">'
    + l.words.map(function(w){ return '<span class="chip">'+esc(w.en)+' <span class="cn">'+esc(w.cn)+'</span></span>'; }).join('')
    + '</div>'
    + '<div class="acts" style="margin-top:9px"><button class="btn sm" onclick="markRound(\''+l.id+'\','+it.idx+')">✔ 已完成这轮复习</button>'
    + '<button class="btn sm sub" onclick="studyStartReviewWords(\''+l.id+'\')">🧠 进入背单词复习</button></div>'
    + '</div>';
  return h;
}

/* ---------- 视图：课程 ---------- */
function viewLessons(){
  var list = data.lessons.slice().sort(function(a,b){ return (b.date+(b.time||'')).localeCompare(a.date+(a.time||'')); });
  if(_lf.studentId) list = list.filter(function(l){ return l.studentId===_lf.studentId; });
  if(_lf.status) list = list.filter(function(l){ return l.status===_lf.status; });
  var sopt = '<option value="">全部学生</option>' + data.students.map(function(s){ return '<option value="'+s.id+'"'+(_lf.studentId===s.id?' selected':'')+'>'+esc(s.name)+'</option>'; }).join('');
  var stMap = [['','全部状态'],['booked','待上课'],['ongoing','上课中'],['done','已完成'],['canceled','已取消']];
  var ssopt = stMap.map(function(x){ return '<option value="'+x[0]+'"'+(_lf.status===x[0]?' selected':'')+'>'+x[1]+'</option>'; }).join('');
  var h = '<div class="card"><h3>📅 课程安排 <button class="btn" onclick="openBooking()">＋ 预约排课</button></h3>'
    + '<div style="display:flex;gap:8px"><select style="margin-top:0" onchange="_lf.studentId=this.value;renderView()">'+sopt+'</select>'
    + '<select style="margin-top:0" onchange="_lf.status=this.value;renderView()">'+ssopt+'</select></div></div>';
  if(!list.length) h += '<div class="card"><div class="empty">暂无课程</div></div>';
  h += list.map(function(l){ return lessonCard(l,{showWords:(l.status==='done')}); }).join('');
  return h;
}

/* ---------- 视图：抗遗忘 ---------- */
function viewReview(){
  var d = _reviewDate;
  var due = dueRoundItems(d);
  var late = due.filter(function(x){ return x.late; });
  var todayOnly = due.filter(function(x){ return !x.late; });
  var doneList = doneRoundItems(d);
  var h = '<div class="card"><h3>⏰ 21天抗遗忘复习</h3>'
    + '<div class="small" style="margin-bottom:8px">节点：第 1 / 3 / 7 / 14 / 21 天各复习一次（下课自动生成）</div>'
    + '<input type="date" value="'+d+'" onchange="_reviewDate=this.value;renderView()">'
    + '</div>';
  h += '<div class="stat-row">'
    + '<div class="stat-cell warn"><div class="n">'+late.length+'</div><div class="t">逾期未复习</div></div>'
    + '<div class="stat-cell"><div class="n">'+todayOnly.length+'</div><div class="t">当天应复习</div></div>'
    + '<div class="stat-cell ok"><div class="n">'+doneList.length+'</div><div class="t">当天已完成</div></div>'
    + '</div>';
  if(late.length) h += '<div class="sec-tip"><span class="overdue">⚠️ 逾期未复习（建议尽快补上）</span></div>' + late.map(function(x){ return reviewItemHTML(x,true); }).join('');
  if(todayOnly.length) h += '<div class="sec-tip">📌 '+fmtShort(d)+' 应复习</div>' + todayOnly.map(function(x){ return reviewItemHTML(x,true); }).join('');
  if(doneList.length){
    h += '<div class="sec-tip">✅ 当天已完成</div>' + doneList.map(function(it){
      return '<div class="review-item finished"><div class="top"><div><span class="stu">'+esc(studentName(it.lesson))+'</span> <span class="round-tag">第'+(it.idx+1)+'轮 · 第'+it.round.offset+'天 ✔</span></div></div></div>';
    }).join('');
  }
  /* 未来 14 天排期预览 */
  var fut = [];
  for(var i=1;i<=14;i++){
    var dd = addDays(d, i);
    data.lessons.forEach(function(l){
      if(l.status!=='done' || !l.words || !l.words.length || !Array.isArray(l.review)) return;
      l.review.forEach(function(rd){
        if(!rd.done && rd.dueDate===dd) fut.push({lesson:l, round:rd, idx:dd});
      });
    });
  }
  if(fut.length){
    h += '<div class="sec-tip">🗓 未来14天排期</div><div class="card">';
    fut.forEach(function(f){
      h += '<div class="when" style="padding:4px 0">· '+fmtShort(f.round.dueDate)+' '+esc(studentName(f.lesson))+'（'+f.lesson.words.length+'词 · 第'+f.round.offset+'天）</div>';
    });
    h += '</div>';
  }
  if(!late.length && !todayOnly.length && !doneList.length) h += '<div class="card"><div class="empty">这天没有复习任务</div></div>';
  return h;
}

/* ---------- 视图：学生 ---------- */

    + '<input type="text" id="new-stu" placeholder="学生姓名">'

  data.students.forEach(function(s){
    var ls = lessonsOf(s.id);

    h += '<div class="card"><h3>'+esc(s.name)
      + ' <button class="btn sm ghost" onclick="delStudent(\''+s.id+'\')">删除</button></h3>'
      + '<div class="small">累计上课 <b class="hl">'+doneN+'</b> 节 · 共排课 '+ls.length+' 节'+(lastDone?' · 最近上课 '+fmtShort(lastDone):'')+'</div>'
      + (doneN>0?'<div class="small" style="margin-top:4px"><a href="javascript:void(0)" class="link-btn" onclick="_lf.studentId=\''+s.id+'\';_lf.status=\'done\';renderApp(\'lessons\')">查看已完成课程 →</a></div>':'')
      + '</div>';
  });
  return h;
}

function viewSettings(){

    + '<div class="sugg" id="pk-sugg"></div>';
}
function pickerSearch(q){
  q = String(q||'').trim().toLowerCase();
  var sugg = document.getElementById('pk-sugg'); if(!sugg) return;
  var picked = {};
  _picker.words.forEach(function(w){ picked[w.en.toLowerCase()]=1; });
  var out=[], i=0;
  while(i<data.wordBank.length && out.length<12){
    var w = data.wordBank[i++];
    if(picked[String(w.en).toLowerCase()]) continue;
    if(q && (w.en||'').toLowerCase().indexOf(q)<0 && (w.cn||'').indexOf(q)<0) continue;
    out.push(w);
  }
  if(!out.length){ sugg.innerHTML = '<div class="empty" style="padding:12px 0">'+(q?'没找到匹配单词':'词库为空，可先去「📚 词库」上传 Excel')+'</div>'; return; }
  sugg.innerHTML = out.map(function(w){
    return '<div class="it" onclick="pickerAdd(\''+esc(w.en).replace(/'/g,"\\'")+'\',\''+esc(w.cn).replace(/'/g,"\\'")+'\')"><b>'+esc(w.en)+'</b><span class="cn">'+esc(w.cn)+'</span><span style="color:#2f6bff">＋</span></div>';
  }).join('');
}
function pickerAdd(en, cn){
  for(var i=0;i<_picker.words.length;i++){ if(_picker.words[i].en.toLowerCase()===en.toLowerCase()) return; }
  _picker.words.push({en:en, cn:cn||''});
  pickerRefresh();
}
function pickerRemove(idx){ _picker.words.splice(idx,1); pickerRefresh(); }
function pickerRefresh(){
  var c = document.getElementById('pk-chips');
  if(c) c.innerHTML = _picker.words.length
    ? _picker.words.map(function(w,i){ return '<span class="chip">'+esc(w.en)+' <span class="cn">'+esc(w.cn)+'</span><span class="x" onclick="pickerRemove('+i+')">✕</span></span>'; }).join('')
    : '<span class="small">未选单词</span>';

  pickerSearch('');

/* Excel 解析组件按需加载（不在页面头部同步加载，避免国内 CDN 慢导致白屏）；jsdelivr 失败自动换 unpkg */
function loadScript(src, cb){
  var s = document.createElement('script');
  s.src = src;
  s.onload = function(){ cb(true); };
  s.onerror = function(){ cb(false); };
  document.head.appendChild(s);
}
function ensureXlsx(cb){
  if(typeof XLSX !== 'undefined'){ cb(true); return; }
  loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js', function(ok){
    if(ok && typeof XLSX !== 'undefined'){ cb(true); return; }
    loadScript('https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js', function(ok2){
      cb(!!(ok2 && typeof XLSX !== 'undefined'));
    });
  });
}
function importExcel(inp){
  var f = inp.files && inp.files[0];
  inp.value='';
  if(!f) return;
  ensureXlsx(function(ok){
    if(!ok){
      alert('Excel 解析组件加载失败（需要联网）。\n请稍后重试，或改用「📋 粘贴导入」：把 Excel 内容复制粘贴进来也可以。');
      return;
    }
    var fr = new FileReader();
    fr.onload = function(e){
      var wb;
      try{ wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'}); }
      catch(err){ alert('文件读取失败：'+err.message); return; }
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false});
      var parsed = parseWordRows(rows);
      if(!parsed.words.length){
        alert('没有识别到有效单词。\n\n格式要求：第一列「单词」，第二列「中文释义」。有表头行（如：单词/中文）可自动识别并跳过。');
        return;
      }
      _importPending = parsed.words;
      openModal('<h3>⬆ 上传预览</h3>'
        + '<div>共识别 <b class="hl">'+parsed.words.length+'</b> 个有效单词'+(parsed.skipped?'，跳过 '+parsed.skipped+' 行（空行/重复/非单词）':'')+'</div>'
        + '<div class="small" style="margin-top:6px">（入库时还会与现有词库自动去重）</div>'
        + '<div style="margin-top:8px"><pre class="bk">'+parsed.words.slice(0,30).map(function(w){ return esc(w.en)+'  '+esc(w.cn); }).join('\n')+(parsed.words.length>30?'\n… 共'+parsed.words.length+'个':'')+'</pre></div>'
        + '<div class="modal-foot"><button class="btn ghost" onclick="closeModal()">取消</button>'
        + '<button class="btn" onclick="confirmImportWords()">确认加入词库</button></div>');
    };
    fr.readAsArrayBuffer(f);
  });
}
function confirmImportWords(){
  if(!_importPending) return;
  var r = dedupeAddWords(_importPending);
  addLog('词库', 'Excel导入：新增 '+r.added+' 词，跳过重复 '+r.skipped+' 词（词库共 '+data.wordBank.length+' 词）');
  saveData();
  _importPending = null;
  closeModal();
  renderView();
  alert('✅ 已加入词库：新增 '+r.added+' 个单词'+(r.skipped?'，跳过重复 '+r.skipped+' 个':'')+'\n当前词库共 '+data.wordBank.length+' 词。');
}

function importBackup(inp){

    data = d;

    addLog('备份', '已导入备份文件');

    renderView();

function changePass(){
  var oldp = document.getElementById('pw-old').value||'';

/* =========================================================
   背单词模块：① 选词 → ② 新词学习 → ③ 抗遗忘复习
   核心规则：默认只显示英文，双击单词才显示中文释义
   ========================================================= */
var _study = { stage:'home', src:'', pickSet:{}, pickN:10, words:[], idx:0, peek:-1, results:{}, result:null };

function studyKey(en){ return String(en==null?'':en).toLowerCase(); }

/* 朗读与双击判断（背单词交互用） */
var _lastClickAt = 0;
function isDoubleClickGap(){ var now = Date.now(); var dbl = (now - _lastClickAt) < 320; _lastClickAt = now; return dbl; }
var _voices = [];
var _speakTimer = null;
function _ttsReady(){ return ('speechSynthesis' in window) && !!window.speechSynthesis; }
function _loadVoices(){
  if(!_ttsReady()) return;
  try{ _voices = window.speechSynthesis.getVoices() || []; }catch(e){ _voices = []; }
  return _voices;
}
function _pickVoice(){
  if(_voices.length === 0) _loadVoices();
  for(var i=0;i<_voices.length;i++){
    if(_voices[i].lang && _voices[i].lang.indexOf('en')===0){ return _voices[i]; }
  }
  return null;
}
if(_ttsReady()){
  _loadVoices();
  // Chrome 异步加载，等事件；旧浏览器 onvoiceschanged 只读，定时轮询兜底
  try{ window.speechSynthesis.onvoiceschanged = function(){ _loadVoices(); }; }catch(e){}
  if(!_voices.length){
    var _iv = setInterval(function(){ _loadVoices(); if(_voices.length){ clearInterval(_iv); _iv=null; } }, 200);
    setTimeout(function(){ if(_iv){ clearInterval(_iv); _iv=null; } }, 4000);
  }
}
function speakWord(en){
  if(!en) return;
  if(!_ttsReady()) return;
  if(_speakTimer){ clearTimeout(_speakTimer); _speakTimer=null; }
  // Chrome 长跑后 TTS 会"假死"（API 还在但没声音），workaround：pause→resume→cancel
  try{ window.speechSynthesis.pause(); }catch(e){}
  try{ window.speechSynthesis.resume(); }catch(e){}
  _speakTimer = setTimeout(function(){
    try{ window.speechSynthesis.cancel(); }catch(e){}
    var u = new SpeechSynthesisUtterance(String(en));
    var v = _pickVoice();
    if(v) u.voice = v;
    u.lang = v ? v.lang : 'en-US';
    u.rate = 0.9; u.volume = 1; u.pitch = 1;
    try{ window.speechSynthesis.speak(u); }catch(e){}
  }, 30);
}
function speakReset(){
  if(!_ttsReady()){ alert('当前浏览器不支持语音合成。'); return; }
  try{ window.speechSynthesis.pause(); }catch(e){}
  try{ window.speechSynthesis.resume(); }catch(e){}
  setTimeout(function(){
    try{ window.speechSynthesis.cancel(); }catch(e){}
    _loadVoices();
    var u = new SpeechSynthesisUtterance('Reset.');
    var v = _pickVoice();
    if(v) u.voice = v;
    u.lang = v ? v.lang : 'en-US';
    try{ window.speechSynthesis.speak(u); }catch(e){}
  }, 60);
}
function _ttsStatus(){
  if(!_ttsReady()) return '不支持';
  var s = window.speechSynthesis;
  return 'speaking=' + !!s.speaking + ' / pending=' + !!s.pending + ' / paused=' + !!s.paused + ' / voices=' + _voices.length;
}
function speakTest(){

  if(_voices.length===0) _loadVoices();

  var enList = _voices.filter(function(v){ return v.lang && v.lang.indexOf('en')===0; }).map(function(v){ return v.name+' ('+v.lang+')'; }).slice(0,5);
  var listTxt = enList.length ? ('\n英文语音：' + enList.join(' / ')) : '\n（无英文语音）';

  }, 200);
}

/* ---- 词库来源与取词 ---- */
function studySources(){
  var out=[];
  if(data.wordBank && data.wordBank.length) out.push({id:'bank', name:'我的词库（'+data.wordBank.length+' 词）'});
  for(var k in PRESET_LIBS){
    if(Object.prototype.hasOwnProperty.call(PRESET_LIBS,k)) out.push({id:'preset:'+k, name:PRESET_LIBS[k].name||k});
  }
  return out;
}
function studyDefaultSrc(){
  var srcs=studySources();
  for(var i=0;i<srcs.length;i++){ if(srcs[i].id.indexOf('preset:')===0) return srcs[i].id; }
  return srcs.length ? srcs[0].id : '';
}
function studySourceName(id){
  if(id==='bank') return '我的词库';
  if(id && id.indexOf('preset:')===0){ var lib=PRESET_LIBS[id.slice(7)]; return lib ? (lib.name||id) : id; }
  return id||'';
}
/* 按顺序加载某个来源的全部单词 */
function studyLibWords(src){
  var out=[];
  if(src==='bank'){
    (data.wordBank||[]).forEach(function(w){ if(w && w.en) out.push({en:w.en, cn:w.cn||'', unit:''}); });
    return out;
  }
  if(src && src.indexOf('preset:')===0){
    var lib=PRESET_LIBS[src.slice(7)]; if(!lib) return [];
    (lib.units||[]).forEach(function(u){
      (u.w||[]).forEach(function(w){ out.push({en:w[0], cn:w[1]||'', unit:u.n||''}); });
    });
  }
  return out;
}
function studyRoundWords(){ return (data.studyRound && data.studyRound.list) || []; }
function studyWordsByScope(scope){
  if(scope==='round') return studyRoundWords().map(function(w){ return {en:w.en, cn:w.cn||''}; });
  if(scope==='learned'){
    var out=[];
    for(var k in data.studyStatus){
      if(!Object.prototype.hasOwnProperty.call(data.studyStatus,k)) continue;
      var s=data.studyStatus[k];
      if(s && s.learned) out.push({en:s.en||k, cn:s.cn||''});
    }
    return out;
  }
  if(scope && scope.indexOf('lesson:')===0){
    var l=getLesson(scope.slice(7));
    return (l && l.words ? l.words : []).map(function(w){ return {en:w.en, cn:w.cn||''}; });
  }
  if(scope && (scope==='bank' || scope.indexOf('preset:')===0)) return studyLibWords(scope);
  return [];
}
function studyScopeOptions(){
  var out=[];
  var rw=studyRoundWords();
  if(rw.length) out.push({id:'round', name:'本轮清单（'+rw.length+' 词）'});
  var n=0; for(var k in data.studyStatus){ var s=data.studyStatus[k]; if(s && s.learned) n++; }
  if(n) out.push({id:'learned', name:'所有学过的单词（'+n+' 词）'});
  data.lessons.filter(function(l){ return l.status==='done' && l.words && l.words.length; })
    .sort(function(a,b){ return (b.date+(b.time||'')).localeCompare(a.date+(a.time||'')); }).slice(0,8)
    .forEach(function(l){ out.push({id:'lesson:'+l.id, name:'📅 '+fmtShort(l.date)+' '+studentName(l)+' 课的单词（'+l.words.length+' 词）'}); });
  studySources().forEach(function(s){ out.push({id:s.id, name:'📚 词库 · '+s.name}); });
  return out;
}

/* ---- 掌握度 ---- */
function studyStatusOf(en){ return data.studyStatus[studyKey(en)] || null; }
function studyStage(en){ var s=studyStatusOf(en); return s ? (s.stage||0) : 0; }
function studyTouch(en, cn, learned){
  var k=studyKey(en);
  if(!data.studyStatus[k]) data.studyStatus[k]={stage:0, right:0, wrong:0, learned:false, en:en, cn:'', lastAt:''};
  var s=data.studyStatus[k];
  if(en) s.en=en;
  if(cn && !s.cn) s.cn=cn;
  if(learned) s.learned=true;
  s.lastAt=nowStr();
  return s;
}
/* 复习判定：认识 → 进度 +1（上限 5）；不认识 → 进度 -1（下限 0） */
function studyMark(en, cn, knew){
  var s=studyTouch(en, cn, true);
  if(knew){ s.right=(s.right||0)+1; s.stage=Math.min(5,(s.stage||0)+1); }
  else { s.wrong=(s.wrong||0)+1; s.stage=Math.max(0,(s.stage||0)-1); }
  return s;
}
function studyStats(){
  var st=data.studyStatus||{}, learned=0, mastered=0, weak=0;
  for(var k in st){
    if(!Object.prototype.hasOwnProperty.call(st,k)) continue;
    var s=st[k]; if(!s) continue;
    if(s.learned) learned++;
    if((s.stage||0)>=3) mastered++;
    if(s.learned && (s.stage||0)<2) weak++;
  }
  return {learned:learned, mastered:mastered, weak:weak};
}

/* ---- 本轮清单 / 记录 ---- */
function studySetRound(list, sourceName){
  data.studyRound = { id:uid(), source:sourceName||'', at:nowStr(),
    list:(list||[]).map(function(w){ return {en:w.en, cn:w.cn||'', unit:w.unit||''}; }) };
  return data.studyRound;
}
function studyAddSession(type, list, results){
  var known=0, unknown=0;
  (list||[]).forEach(function(w){
    var r=results ? results[studyKey(w.en)] : '';
    if(r==='know') known++; else if(r==='unknown') unknown++;
  });
  data.studySessions = data.studySessions || [];
  data.studySessions.unshift({id:uid(), date:todayStr(), at:nowStr(), type:type,
    total:(list||[]).length, known:known, unknown:unknown,
    words:(list||[]).map(function(w){ return w.en; })});
  if(data.studySessions.length>500) data.studySessions.length=500;
}

      + '</div>';
  }).join('');
  h+='<div style="margin-top:12px"><button class="btn big" id="sr-sub" onclick="studySubmitReview()">提交本轮复习</button></div></div>';
  return h;
}
function studySpeakAndPeekRow(i){
  if(isDoubleClickGap()) return;
  var el=document.getElementById('rw'+i); if(!el) return;
  if(el.className.indexOf('peek')<0) el.className += ' peek';
  var w=(_study.words||[])[i];
  if(w) speakWord(w.en);
}
function studyHideCnRow(i){
  var el=document.getElementById('rw'+i); if(!el) return;
  el.className = el.className.replace(/\s*peek/,'');
}
function studyAnswer(i, r){
  var w=(_study.words||[])[i]; if(!w) return;
  _study.results[studyKey(w.en)]=r;
  var el=document.getElementById('rw'+i);
  if(el){
    el.className='rw'+(r==='know'?' ok':' no')+(el.className.indexOf('peek')>=0?' peek':'');
    var okb=el.querySelector('.rw-ok'), nob=el.querySelector('.rw-no');
    if(okb) okb.className='rw-b rw-ok'+(r==='know'?' on':'');
    if(nob) nob.className='rw-b rw-no'+(r==='unknown'?' on':'');
  }
  var known=0, unknown=0;
  for(var kk in _study.results){ if(!Object.prototype.hasOwnProperty.call(_study.results,kk)) continue; if(_study.results[kk]==='know') known++; else unknown++; }
  var e1=document.getElementById('sr-know'), e2=document.getElementById('sr-no');
  if(e1) e1.textContent=known;
  if(e2) e2.textContent=unknown;
  var sub=document.getElementById('sr-sub');
  if(sub) sub.textContent='提交本轮复习（'+(known+unknown)+'/'+(_study.words||[]).length+'）';
}
function studySubmitReview(){
  var list=_study.words||[], res=_study.results||{};
  var miss=list.filter(function(w){ return !res[studyKey(w.en)]; });
  if(miss.length && !confirm('还有 '+miss.length+' 个单词没有判断。\n未判断的将按「不认识」处理，确定提交吗？')) return;
  var known=0, unknown=0, wrong=[];
  list.forEach(function(w){
    var r=res[studyKey(w.en)]||'unknown';
    studyMark(w.en, w.cn, r==='know');
    if(r==='know'){ known++; } else { unknown++; wrong.push({en:w.en, cn:w.cn||''}); }
  });
  studyAddSession('review', list, res);
  addLog('背单词', '抗遗忘复习 '+list.length+' 词（认识 '+known+' / 不认识 '+unknown+'）');
  saveData();
  _study.result={type:'review', total:list.length, known:known, unknown:unknown, wrong:wrong};
  _study.stage='result';
  renderView();
  window.scrollTo(0,0);
}
function studyResultHTML(){
  var r=_study.result; if(!r) return studyBackCard('');
  var h='<div class="card"><h3>本轮复习完成 🎉</h3>'
    + '<div class="sbar"><span class="sb g">✅ 认识 '+r.known+'</span><span class="sb r">❌ 不认识 '+r.unknown+'</span><span class="sb">共 '+r.total+'</span></div>';
  if(r.wrong && r.wrong.length){
    h+='<div class="sec-tip">❌ 需要加强的单词（'+r.wrong.length+'）</div>'
      + r.wrong.map(function(w){ return '<div class="rw no"><span class="rw-en">'+esc(w.en)+'</span><span class="rw-cn" style="display:block">'+esc(w.cn||'')+'</span></div>'; }).join('');
  }else{
    h+='<div class="small" style="margin-top:10px">全部认识，很棒 👍</div>';
  }
  h+='<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">'
    + ((r.wrong && r.wrong.length) ? '<button class="btn" onclick="studyRetryWrong()">再复习不认识的（'+r.wrong.length+'）</button>' : '')
    + '<button class="btn ghost" onclick="studyExit()">返回首页</button></div></div>';
  return h;
}
function studyRetryWrong(){
  var r=_study.result;
  if(!r || !r.wrong || !r.wrong.length) return;
  _study.words=r.wrong.slice(); _study.results={}; _study.peek=-1; _study.result=null; _study.stage='review';
  renderView();
}
function studyExit(){ _study.stage='home'; _study.peek=-1; _study.result=null; renderView(); window.scrollTo(0,0); }
function studyClearRound(){
  if(!confirm('确定清空本轮学习清单吗？\n（已学、已掌握单词的进度不受影响）')) return;
  data.studyRound=null;
  saveData();
  renderView();
}
function studyBackCard(msg){
  return '<div class="card"><div class="empty">'+esc(msg||'')+'</div><button class="btn big" onclick="studyExit()">返回背单词首页</button></div>';
}

/* ---------- 弹窗 ---------- */
function openModal(html){
  var m = document.getElementById('modal');
  document.getElementById('modal-box').innerHTML = html;
  m.style.display='block';
  if(typeof _picker!=='undefined' && _picker) pickerRefresh();
}
function closeModal(){
  document.getElementById('modal').style.display='none';
  _picker = null;
  _importPending = null;
}

boot();
</script>
</body>
</html>
